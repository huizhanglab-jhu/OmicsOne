[analysis]
# Differential test method.
# Options: Wilcoxon(Unpaired), Wilcoxon(Paired), T-test(Unpaired), T-test(Paired)
# Default: Wilcoxon(Unpaired)
method = Wilcoxon(Unpaired)

# Strip Ensembl version suffixes from feature IDs, e.g. ENSG000001.12 -> ENSG000001.
# Options: true, false
# Default: true for RNA/protein gene-level matrices; use false for phosphosite-style IDs.
strip_feature_version = true

[diff]
# FDR cutoff used to call significant differential features.
# Default: 0.01
fdr_cutoff = 0.01

# Absolute log2 fold-change cutoff for strong up/down calls.
# Significance labels: S-U if Log2FC > cutoff and FDR < cutoff; S-D if Log2FC < -cutoff and FDR < cutoff.
# Default: 1.0
log2fc_cutoff = 1.0

# Maximum allowed missing-value ratio across all samples for a feature.
# Range: 0.0-1.0
# Default: 0.5
max_miss_ratio_global = 0.5

# Maximum allowed missing-value ratio inside each group for a feature.
# Range: 0.0-1.0
# Default: 0.5
max_miss_ratio_group = 0.5

# Minimum non-missing sample count required in each group, or valid pairs for paired tests.
# Default: 4
min_sample_size = 4

[enrichment]
# Gene-set libraries or local GMT files for enrichment.
# Options: Enrichr library names such as MSigDB_Hallmark_2020, KEGG_2021_Human, or full paths to .gmt files.
# Multiple values: comma-separated or one per line.
# Default: MSigDB_Hallmark_2020
gene_sets = MSigDB_Hallmark_2020

# Adjusted P-value cutoff for enriched terms.
# Default: 0.05
enrichment_fdr_cutoff = 0.05

# Organism passed to GSEApy/Enrichr when remote enrichment is enabled.
# Common options: human, mouse
# Default: human
organism = human

# Enrichment background behavior.
# Options:
#   gene_list: local GMT enrichment using total detected genes as background. Recommended replay default.
#   online: remote Enrichr enrichment. Requires allow_remote_enrichr = true.
#   notebook or count: compatibility modes for older notebook-style Enrichr calls.
# Default: gene_list
enrichment_background_mode = gene_list

# Prefer local GMT files from ~/.cache/gseapy or explicit .gmt paths before remote Enrichr.
# Options: true, false
# Default: true
prefer_local_gene_sets = true

# Permit remote Enrichr calls if a gene set is not available locally.
# Options: true, false
# Default: false for local replay to avoid sending gene lists outside the machine.
# To reproduce previous online runs, set enrichment_background_mode = online, prefer_local_gene_sets = false, allow_remote_enrichr = true.
allow_remote_enrichr = false

# Pathway names to omit from the plotted top enriched terms.
# This does not remove rows from up_enrichr_df.tsv/down_enrichr_df.tsv; it only filters the barchart table.
# Default: common infection/technical pathways listed below.
skip_pathways =
    Phagosome,
    Human papillomavirus infection,
    Pertussis,
    Malaria,
    Arrhythmogenic right ventricular cardiomyopathy,
    Staphylococcus aureus infection,
    Regulation of actin cytoskeleton

# Number of up and down enriched terms to show in the enrichment barchart after skip_pathways filtering.
# Default: 10
enrichment_top_n = 10

[output]
# Write a JavaScript helper for n8n/API automation.
# Options: true, false
# Default: false
write_n8n_script = false

[plot]
# X-axis label for the volcano plot.
# Default: Log2FC(Tumor/NAT)
xlabel = Log2FC(Tumor/NAT)

# Volcano figure size in inches.
# Default: 4.0 x 4.0
volcano_width = 4.0
volcano_height = 4.0

# Enrichment barchart size is calculated as ratio * size_scale unless explicit width/height are supplied.
# Default effective size: 2.0 * 4.0 by 1.5 * 4.0 = 8.0 x 6.0 inches.
enrichment_width_ratio = 2.0
enrichment_height_ratio = 1.5
enrichment_size_scale = 4.0

# Enrichment barchart x-axis range.
# Negative side is down-enriched terms; positive side is up-enriched terms.
# Defaults: -25.0 to 40.0
enrichment_min_x = -25.0
enrichment_max_x = 40.0

# Raster output DPI for PNG files.
# Default: 300
dpi = 300

# TIFF output DPI.
# Default: 600
tiff_dpi = 600

# Plot font family. Use an installed system font.
# Default: Liberation Sans
font_family = Liberation Sans

# Base font size for plots.
# Default: 10.0
font_size = 10.0

# Keep PDF text editable by embedding TrueType text instead of converting to paths.
# Options: true, false
# Default: true
editable_pdf_text = true

# Volcano/enrichment colors.
# Defaults: background gray, up red, down blue.
background_color = #808080
up_color = #FF0000
down_color = #0000FF

# Point sizes for all volcano points and significant volcano points.
# Defaults: 1.0 and 5.0
point_size = 1.0
significant_point_size = 5.0

# Write an HTML report combining parameters, result summary, plots, and enrichment tables.
# Options: true, false
# Default: true
write_html_report = true

[style]
# Use legacy notebook plot styling for closer notebook reproduction.
# Options: true, false
# Default: false
notebook_style_plots = false

# Show plot titles on generated figures.
# Options: true, false
# Default: true
show_titles = true

