[settings]
# Minimum NUM_MUT threshold used to keep genes for plotting.
# Range: 0.0-1.0
# Default: 0.15
mutation_threshold = 0.15

[output]
# Optional explicit PDF filenames. Leave blank to derive names from cohort.
heatmap_filename =
mutation_type_filename =

# Optional prefix added to generated PDF filenames.
output_prefix =

[api]
# API endpoint used by post_mutation_figures_api.
# The default OmicsOne API entrypoint currently starts on port 8001.
api_url = http://127.0.0.1:8001/api/v1/mutations/heatmap/figures
