[plot]
# Y-axis label for each boxplot.
# Default: Log2 abundance
ylabel = Log2 abundance

# Single boxplot size in inches.
# Defaults: 2.25 x 3.0
width = 2.25
height = 3.0

# Raster DPI used when creating the Matplotlib figure before PDF export.
# Default: 300
dpi = 300

# Plot font settings. Use an installed system font.
# Defaults: Liberation Sans, 9.0
font_family = Liberation Sans
font_size = 9.0

# Keep PDF text editable by embedding TrueType text instead of converting to paths.
# Options: true, false
# Default: true
editable_pdf_text = true

# Box colors.
# Defaults: Tumor blue, Normal orange
tumor_color = #1f77b4
normal_color = #ff7f0e

[output]
# Optional prefix used in generated PDF filenames.
# Leave blank to use lower-case cohort_omics.
output_prefix =

# Write a JavaScript helper for n8n/API automation.
# Options: true, false
# Default: false
write_n8n_script = false
