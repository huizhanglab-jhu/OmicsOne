[input]
# Existing differential result tables.
# protein_diff_path supplies the x-axis Log2FC values by protein/gene.
# phospho_diff_path supplies the y-axis Log2FC values by phosphosite.
protein_diff_path =
phospho_diff_path =

# Optional phospho volcano/enrichment run directory. When gene_selection_mode is
# filtered, pure_up_genes.tsv and pure_down_genes.tsv are read from this folder
# unless the explicit paths below are supplied.
phospho_run_dir =
pure_up_genes_path =
pure_down_genes_path =

# FASTA is used to map Ensembl IDs to gene symbols.
fasta_path = F:\lab\HsinI\Head and Neck & Lung\fasta\GENCODE.V42.basic.CHR.combined_contaminants.gpquest3.fasta

# GMT pathway library. The default expects the GSEApy cached Hallmark GMT.
gmt_path = C:\Users\yhu39\.cache\gseapy\Enrichr.MSigDB_Hallmark_2020.gmt

# Log2FC columns used from the diff tables.
protein_log2fc_column = Log2FC(mean)
phospho_log2fc_column = Log2FC(mean)

# Optional replay-friendly table input. Use TSV or CSV with columns:
# pathway_folder, pathway_term, highlight_path
# Example:
# E2F targets    E2F Targets    E:\run\E2F targets\highlight_sites.txt
pathway_table_path =

[output]
output_dir =

[selection]
# filtered: use pure_up_genes for up pathways and pure_down_genes for down pathways.
# all_pathway: use all GMT pathway genes found in the phospho differential table.
gene_selection_mode = filtered

[tables]
# Optional input mode for plotting from prebuilt filtered phosphosite-protein tables.
# If this section is supplied, the pipeline uses these tables directly instead of
# rebuilding them from protein_diff_path/phospho_diff_path.
# E2F targets = E:\run\HNSCC_E2F_phosphosite_protein.tsv
# G2-M check point = E:\run\HNSCC_G2M_phosphosite_protein.tsv
# myogenesis = E:\run\HNSCC_myogenesis_phosphosite_protein.tsv

[pathways]
# Direct config alternative to pathway_table_path.
# Left side is the output subfolder. Right side must match the GMT term.
# E2F targets = E2F Targets
# G2-M check point = G2-M Checkpoint
# myogenesis = Myogenesis

[directions]
# Used by the phosphosite-protein table pipeline when gene_selection_mode = filtered.
# Left side must match [pathways]. Values are up or down.
# E2F targets = up
# G2-M check point = up
# myogenesis = down

[highlights]
# Direct config alternative to pathway_table_path.
# Left side must match [pathways]. Right side is a text file of highlighted dots.
# Each highlight file should contain one phosphosite per line, for example:
# PFKM|S667
# AKT2|S34
# E2F targets = E:\run\E2F targets\highlight_sites.txt

[plot]
width = 5
height = 4
dpi = 300
tiff_dpi = 600
show_title = true
title_template = {pathway}
font_family = Liberation Sans
font_scale = 1.0
point_size = 10
highlight_point_size = 18

