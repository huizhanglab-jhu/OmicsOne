[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-rust>=1.8"]
build-backend = "setuptools.build_meta"

[project]
name = "omicsone"
version = "2.0.0a0"
description = "OmicsOne Streamlit app"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "streamlit==1.45.0",
    "numpy==2.2.5",
    "pandas==2.2.3",
    "scipy==1.16.0",
    "matplotlib==3.10.1",
    "seaborn==0.13.2",
    "statsmodels==0.14.4",
    "scikit-learn==1.6.1",
    "umap-learn==0.5.7",
    "numba==0.61.2",
    "llvmlite==0.44.0",
    "pynndescent==0.5.13",
    "plotly==5.24.1",
    "tqdm==4.67.1",
    "pyteomics==4.7.5",
    "adjustText==1.3.0",
    "gseapy==1.1.8",
    "openpyxl==3.1.5",
    "streamlit-aggrid==1.1.4.post1",
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
]

[project.scripts]
omicsone = "omicsone.cli.__main__:main"
omicsone-api = "omicsone.api.__main__:main"
omicsone-app = "omicsone_streamlit.__main__:main"
omicsone-replay-cnv-correlation = "omicsone.replay.cnv_correlation_pipeline:main"
omicsone-replay-cnv-correlation-clean-figures = "omicsone.replay.cnv_correlation_clean_figures:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omicsone*", "omicsone_streamlit*"]

[tool.setuptools.package-data]
"omicsone" = [
    "resources/**/*.tsv",
    "replay/*.ini",
]
"omicsone_streamlit" = [
    "**/*.toml",
    "**/*.yaml",
    "**/*.yml",
    "**/*.json",
    "**/*.csv",
    "**/*.png",
    "**/*.jpg",
    "**/*.jpeg",
    "**/*.svg",
    "**/*.ico",
    "**/*.ttf",
    "**/*.otf",
    "**/*.ini",
]

