[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omicsone"
# 若使用共享版本：改成动态
version = "0.1.3"       
description = "OmicsOne Streamlit app (source)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["streamlit>=1.30","seaborn>=0.13.2", "tqdm>=4.67.1","pyteomics>=4.7.5",
                "numpy>=2.2.5", "pandas>=2.2.3", "scipy>=1.16.0","scikit-learn>=1.6.1","statsmodels>=0.14.4",
                "umap-learn>=0.5.7","adjustText>=1.3.0","gseapy>=1.1.8","openpyxl>=3.1.5","streamlit-aggrid>=1.1.4.post1",
                "fastapi>=0.115.12","uvicorn>=0.34.2"]



[tool.setuptools.package-dir]
"" = "../../src"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["omicsone*", "omicsone_streamlit*"]

[tool.setuptools.package-data]
"omicsone_streamlit" = [
  "**/*.toml", "**/*.yaml", "**/*.yml",
  "**/*.json", "**/*.csv",
  "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg", "**/*.ico",
  "**/*.ttf", "**/*.otf", "**/*.ini"
]

[project.scripts]
omicsone = "omicsone.__main__:main"
omicsone-api = "omicsone.api.__main__:main"
